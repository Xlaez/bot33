services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot33
      POSTGRES_PASSWORD: bot33
      POSTGRES_DB: bot33
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot33 -d bot33"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/watcher
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/api
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
