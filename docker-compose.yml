services:
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: bot33
      POSTGRES_PASSWORD: bot33
      POSTGRES_DB: bot33
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot33 -d bot33"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6-alpine
    ports:
      - "6381:6379"

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/watcher
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      - .env
    environment:
      # Inside the compose network use service DNS, not host-mapped localhost ports.
      DATABASE_URL: postgres://bot33:bot33@postgres:5432/bot33?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WALLETS_SEED_PATH: /app/configs/wallets.seed.yaml
      COLLECTIONS_PATH: /app/configs/collections.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/api
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bot33:bot33@postgres:5432/bot33?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WALLETS_SEED_PATH: /app/configs/wallets.seed.yaml
      COLLECTIONS_PATH: /app/configs/collections.yaml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  meme-watcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/meme-watcher
        GIT_SHA: ${GIT_SHA:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bot33:bot33@postgres:5432/bot33?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
