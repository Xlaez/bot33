name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy /opt/bot33
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${SERVER_HOST:-}" ] || { echo "Missing secret: SERVER_HOST"; missing=1; }
          [ -n "${SERVER_USERNAME:-}" ] || { echo "Missing secret: SERVER_USERNAME"; missing=1; }
          [ -n "${SERVER_KEY:-}" ] || { echo "Missing secret: SERVER_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if ! printf '%s' "$SERVER_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "SERVER_KEY does not look like a private key."
            echo "Paste the FULL private key (including BEGIN/END lines), not the .pub file."
            exit 1
          fi
          echo "Secrets present. Key fingerprint:"
          keyfile="$(mktemp)"
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keygen -lf "$keyfile" || true
          rm -f "$keyfile"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_KEY }}

      - name: Trust server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          port="${SERVER_PORT:-22}"
          ssh-keyscan -p "$port" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -p "$port" \
            "${SERVER_USERNAME}@${SERVER_HOST}" \
            'echo ssh_ok; whoami; hostname; test -d /opt/bot33 || sudo mkdir -p /opt/bot33; test -w /opt/bot33 || sudo chown "$(whoami):$(whoami)" /opt/bot33; ls -ld /opt/bot33'

      - name: Sync code to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'web/node_modules/' \
            --exclude 'web/dist/' \
            --exclude 'bin/' \
            --exclude '.cursor/' \
            --exclude 'agent-transcripts/' \
            -e "ssh -p ${port} -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "${SERVER_USERNAME}@${SERVER_HOST}:/opt/bot33/"

      - name: Build and restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          envs: GIT_SHA
          script: |
            set -euo pipefail
            cd /opt/bot33
            if [ ! -f .env ]; then
              echo "Missing /opt/bot33/.env — create it on the server before deploying."
              exit 1
            fi
            export GIT_SHA="${GIT_SHA:-deploy}"
            echo "Building with GIT_SHA=${GIT_SHA}"
            # Force a fresh web UI layer — rsync excludes web/dist, so the image must rebuild it.
            docker compose build --pull --build-arg "GIT_SHA=${GIT_SHA}"
            docker compose up -d --force-recreate --remove-orphans
            docker compose ps
            echo "UI build id in api image:"
            docker compose exec -T api cat /app/web/dist/build-id.txt || true
            docker compose logs --tail=40 api watcher || true
        env:
          GIT_SHA: ${{ github.sha }}
